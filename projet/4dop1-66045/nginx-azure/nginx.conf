events { }

http {
    # Repartition A/B en round-robin, comme pour le nginx local (TD 05).
    # Les deux membres sont des serveurs locaux definis plus bas, et non
    # directement les hotes Azure : l'explication est juste avant ces serveurs.
    upstream apps-ab-azure {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
    }

    server {
        listen 80;

        location /test {
            proxy_pass http://apps-ab-azure/;
        }
    }

    # Pourquoi deux serveurs locaux plutot que les hotes Azure dans l'upstream :
    # Azure App Service choisit l'application a servir d'apres l'en-tete Host.
    # Or quand proxy_pass pointe vers un upstream groupe, nginx transmet le NOM
    # DU GROUPE en Host. Les deux requetes arriveraient donc avec
    # "Host: apps-ab-azure", qui ne correspond a aucune application, et Azure
    # repondrait 404. En donnant a chaque version son propre bloc server dont le
    # proxy_pass porte le nom d'hote ecrit en clair, nginx transmet le bon Host.
    # C'est le motif de reverse proxy vers un hote HTTPS externe du TD 05 p.3.

    # Version A : Spring Boot
    server {
        listen 8001;

        location / {
            proxy_pass https://app-spring-66045.azurewebsites.net/;
            # Envoie le nom d'hote dans le handshake TLS. Azure mutualise
            # plusieurs applications derriere les memes adresses IP et a besoin
            # de ce nom pour presenter le bon certificat.
            proxy_ssl_server_name on;
        }
    }

    # Version B : Django
    server {
        listen 8002;

        location / {
            proxy_pass https://app-django-66045.azurewebsites.net/;
            proxy_ssl_server_name on;
        }
    }
}
