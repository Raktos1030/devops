
events { }

http {

    # Nginx alternera entre Spring (Version A) et Django (Version B)
    upstream ab-backend {
        server spring-app:8080;
        server django-app:8000;
    }

    server {
        listen 80;
        location /test {
            proxy_pass http://ab-backend/;
        }

        # Routes directes pour pouvoir tester chaque version individuellement
        location /spring {
            proxy_pass http://spring-app:8080/;
        }

        location /django {
            proxy_pass http://django-app:8000/;
        }
    }
}

